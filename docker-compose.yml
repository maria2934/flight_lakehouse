services:
  app:
    build: .
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ALLOW_HTTP=true
      - S3_BUCKET=s3://lakehouse
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5050:5000"
    # Добавлен флаг --allowed-hosts "*" для решения ошибки 403
    command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts "*" --default-artifact-root s3://mlflow/ --backend-store-uri sqlite:///mlflow.db
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ALLOW_HTTP=true
    volumes:
      - ./mlruns:/mlruns

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/lakehouse || true;
      /usr/bin/mc mb myminio/mlflow || true;
      exit 0;
      "
